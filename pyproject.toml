# No build backend on purpose: Hermes merges every profile's plugin copy into
# one uv workspace and only renames metadata-only members. A build backend
# would make two profiles collide on the project name "clawchat-gateway".
[project]
name = "clawchat-gateway"
dynamic = ["version"]
description = "ClawChat v2 gateway adapter for hermes-agent"
license = { text = "MIT" }
authors = [{ name = "CLAWLING PTE. LTD." }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["clawchat", "hermes", "hermes-agent", "plugin", "gateway", "chat"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["websockets>=13,<16"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=4", "PyYAML>=6,<7", "ruamel.yaml>=0.18,<0.19"]

[project.urls]
Homepage = "https://github.com/clawling/clawchat-plugin-hermes-agent"
Repository = "https://github.com/clawling/clawchat-plugin-hermes-agent"
Issues = "https://github.com/clawling/clawchat-plugin-hermes-agent/issues"

[tool.uv]
package = false

[tool.setuptools]
include-package-data = true

# Single source of truth for the package version: clawchat_gateway.__version__.
# The plugin reports this same attribute to the ClawChat backend (adapter.py imports
# it as _PLUGIN_VERSION); pip's setuptools fallback also derives its version here.
[tool.setuptools.dynamic]
version = { attr = "clawchat_gateway.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["clawchat_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
